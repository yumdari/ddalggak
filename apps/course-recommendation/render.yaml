services:
  - type: web
    name: ddalggak-api
    runtime: python
    plan: free
    rootDir: apps/course-recommendation/backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: OPENAI_MODEL
        value: gpt-4o-mini
