name: Verify MVP
on: [push, pull_request]
defaults:
  run:
    working-directory: apps/course-recommendation
jobs:
  main-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/course-recommendation/frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.lock.txt
      - run: ruff check backend
      - run: pytest -q
        working-directory: apps/course-recommendation/backend
      - run: npm ci
        working-directory: .
      - run: npm ci
        working-directory: apps/course-recommendation/frontend
      - run: npm run lint
        working-directory: apps/course-recommendation/frontend
      - run: npm run typecheck
        working-directory: apps/course-recommendation/frontend
      - run: npm run build
        working-directory: apps/course-recommendation/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: apps/course-recommendation/frontend
      - name: Start production servers and run browser flows
        run: |
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/ddalggak-api.log 2>&1 &
          npm --prefix frontend run start > /tmp/ddalggak-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/course-plan/api/courses > /dev/null; then break; fi
            sleep 2
          done
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: apps/course-recommendation/frontend/test-results
